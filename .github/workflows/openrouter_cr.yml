name: Weekly OpenRouter Code Review

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch: 

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Codebase Analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - << 'EOF'
          import os
          import json
          import requests

          ignored_dirs = ['node_modules', '.commandkit', 'bin', '.git', 'dist', 'build', '.next', 'coverage']
          valid_extensions = ['.ts', '.tsx', '.js', '.jsx', '.java']
          codebase_content = ""
          max_chars = 200_000  # Cap context size to avoid context limit errors

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ignored_dirs]
              for file in files:
                  if any(file.endswith(ext) for ext in valid_extensions):
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              file_data = f.read()
                              if len(codebase_content) + len(file_data) > max_chars:
                                  print("Reached context limit threshold; stopping file aggregation.")
                                  break
                              codebase_content += f"\n\n--- File: {file_path} ---\n" + file_data
                      except Exception as e:
                          print(f"Warning: Failed to read {file_path}: {e}")

          if not codebase_content:
              print("No matching source files found to review.")
              exit(0)

          # FIXED: Correct OpenRouter Chat Completions API endpoint
          url = "https://openrouter.ai/api/v1/chat/completions"
          headers = {
              "Authorization": f"Bearer {os.getenv('OPENROUTER_API_KEY')}",
              "Content-Type": "application/json",
              "HTTP-Referer": "https://github.com",
              "X-Title": "GitHub Actions Code Reviewer"
          }

          prompt = (
              "You are a principal software engineer. Review the following codebase files and generate "
              "a structured weekly health update report. Focus on:\n"
              "1. Potential bugs, runtime logic errors, or edge cases.\n"
              "2. Code quality, performance improvements, and modularity defects.\n"
              "3. Actionable refactoring recommendations.\n\n"
              f"Codebase:\n{codebase_content}"
          )

          data = {
              "model": "deepseek/deepseek-chat",
              "messages": [{"role": "user", "content": prompt}]
          }

          response = requests.post(url, headers=headers, data=json.dumps(data))

          if response.status_code == 200:
              try:
                  result = response.json()
                  review_text = result['choices'][0]['message']['content']
                  with open("weekly_update.md", "w", encoding="utf-8") as out:
                      out.write(review_text)
                  print("Successfully generated weekly update report.")
              except Exception as e:
                  print(f"Failed to parse valid OpenRouter JSON response: {e}")
                  print(f"Raw Output: {response.text}")
                  exit(1)
          else:
              print(f"API Error Response Status Code: {response.status_code}")
              print(f"Raw Output: {response.text}")
              # FIXED: Ensure job fails when API request fails
              exit(1)
          EOF

      - name: Upload Review Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-code-review
          path: weekly_update.md