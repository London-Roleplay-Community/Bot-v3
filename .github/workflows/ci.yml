name: CI

on:
  push: 
    branches: [ main ]
  pull_request: 
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@{{ matrix.node-version }}
          install: false
          cache: true

      - name: Ensure node and pnpm are installed
        run: |
          node -v
          pnpm -v
      
      - name: Install deps
        run: pnpm i --frozen-lockfile
